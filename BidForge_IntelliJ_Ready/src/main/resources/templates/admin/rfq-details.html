<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RFQ Review | BidForge</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="bg-light"><div class="layout d-flex min-vh-100 bg-body-tertiary"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main flex-grow-1 min-vh-100"><div th:replace="~{fragments/layout :: topbar}"></div><section class="page container-fluid py-4">
<div class="d-flex justify-content-between align-items-start mb-4"><div><h1 class="h3" th:text="${rfq.rfqNo}"></h1><p class="text-secondary mb-0">Indent <strong th:text="${rfq.indentNo}"></strong> · <span th:text="${rfq.status}"></span></p></div><div class="d-flex gap-2"><a th:if="${rfq.status == 'CLOSED'}" class="btn btn-warning" th:href="@{'/admin/rfq/' + ${rfq.rfqId} + '/extend'}">Reopen RFQ</a><form th:if="${rfq.status == 'OPEN'}" method="post" th:action="@{'/admin/rfq/' + ${rfq.rfqId} + '/close'}"><button class="btn btn-secondary">Close RFQ</button></form></div></div>
<div class="row g-3"><div class="col-md-4"><div class="card shadow-sm border-0"><div class="card-body"><div class="text-secondary small">Bid Items</div><div class="h3" th:text="${#lists.size(rfq.items)}"></div></div></div></div><div class="col-md-4"><div class="card shadow-sm border-0"><div class="card-body"><div class="text-secondary small">Vendor Quotations</div><div class="h3" th:text="${#lists.size(quotations)}"></div></div></div></div><div class="col-md-4"><div class="card shadow-sm border-0"><div class="card-body"><div class="text-secondary small">Closing Date</div><div class="h5" th:text="${rfq.expiryDateOfBid == null ? '-' : #temporals.format(rfq.expiryDateOfBid,'dd MMM yyyy HH:mm')}"></div></div></div></div></div>
<div class="card shadow-sm border-0 mt-4"><div class="card-body"><h5>Bid Items</h5><div class="table-responsive"><table class="table table-bordered table-hover"><thead class="table-light"><tr><th>Line No</th><th>Item No</th><th>Item Name</th><th>Factory</th><th>Qty</th><th>UOM</th><th>Delivery Date</th><th>Location</th><th>Specifications</th></tr></thead><tbody><tr th:each="item : ${rfq.items}"><td th:text="${item.rfqLineNo}"></td><td th:text="${item.itemNo}"></td><td th:text="${item.itemName}"></td><td th:text="${item.factoryCode == null ? '-' : item.factoryCode}"></td><td th:text="${item.reqQty}"></td><td th:text="${item.uom}"></td><td th:text="${item.reqDeliveryDate == null ? '-' : #temporals.format(item.reqDeliveryDate,'dd-MM-yyyy')}"></td><td th:text="${item.deliveryLocation}"></td><td th:text="${item.description}"></td></tr></tbody></table></div></div></div>
<div class="card shadow-sm border-0 mt-4"><div class="card-body"><h5>Vendor Quotations</h5><div class="table-responsive"><table class="table table-hover align-middle"><thead class="table-light"><tr><th>Vendor</th><th>Bid No</th><th>Total</th><th>Remarks</th><th>Submitted</th><th>Status</th><th>Invoice</th><th>Action</th></tr></thead><tbody>
<tr th:each="q : ${quotations}"><td th:text="${q.vendor.fullName}"></td><td th:text="${q.bidNo}"></td><td th:text="${'₹' + q.quotedAmount}"></td><td th:text="${q.remarks == null or #strings.isEmpty(q.remarks) ? '-' : q.remarks}"></td><td th:text="${q.submittedDate == null ? '-' : #temporals.format(q.submittedDate,'dd MMM yyyy HH:mm')}"></td><td><span class="badge" th:classappend="${q.status == 'APPROVED' ? ' text-bg-success' : (q.status == 'REJECTED' ? ' text-bg-danger' : ' text-bg-secondary')}" th:text="${q.status}"></span></td><td><span th:if="${q.invoiceGenerated}" class="badge text-bg-success">Generated</span><span th:unless="${q.invoiceGenerated}" class="text-secondary">-</span></td><td><div class="d-flex gap-1"><a class="btn btn-outline-dark btn-sm" th:href="@{'/admin/quotation/' + ${q.quotationId}}">View Details</a><form th:if="${q.status == 'SUBMITTED' && rfq.status != 'APPROVED'}" method="post" th:action="@{'/admin/quotation/' + ${q.quotationId} + '/approve'}"><button class="btn btn-success btn-sm">Approve</button></form><form th:if="${q.status == 'SUBMITTED' && rfq.status != 'APPROVED'}" method="post" th:action="@{'/admin/quotation/' + ${q.quotationId} + '/reject'}"><button class="btn btn-danger btn-sm">Reject</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(quotations)}"><td colspan="8" class="text-center text-secondary py-4">No quotations submitted yet.</td></tr></tbody></table></div></div></div>
<div class="card shadow-sm border-0 mt-4"><div class="card-body"><h5>RFQ / Bid History</h5><div th:each="h : ${history}" class="border-bottom py-3"><strong th:text="${h.action}"></strong><p class="mb-1 text-secondary" th:text="${h.remarks}"></p><small class="text-secondary" th:text="${#temporals.format(h.createdAt,'dd MMM yyyy HH:mm') + ' · ' + (h.oldStatus == null ? '-' : h.oldStatus) + ' → ' + (h.newStatus == null ? '-' : h.newStatus)}"></small></div></div></div>
</section></main></div></body></html>
