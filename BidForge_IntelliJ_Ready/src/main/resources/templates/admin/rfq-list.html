<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RFQ Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="layout d-flex min-vh-100 bg-body-tertiary">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <main class="main flex-grow-1 min-vh-100">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <section class="page container-fluid py-4">
            <div class="page-heading d-flex justify-content-between align-items-start gap-3 mb-4">
                <div><h1 class="page-title fw-bold mb-1">RFQ Management</h1></div>
                <a class="btn btn-success" href="/admin/rfq/add">+ New RFQ</a></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div class="card shadow-sm border-0 p-4">
                <div class="table-toolbar d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                    <div class="search-box input-group"><span class="input-group-text">⌕</span><input data-table-search placeholder="Search RFQ, indent, item or status..." class="form-control"/></div>
                    <label class="entries-control form-label fw-semibold mb-0 d-flex align-items-center gap-2">Show <select data-page-size class="form-select form-select-sm">
                        <option>10</option>
                        <option>25</option>
                        <option>50</option>
                        <option>100</option>
                    </select> entries</label></div>
                <div class="table-wrap table-responsive border rounded">
                    <table class="table table-hover align-middle mb-0" data-table>
                        <thead>
                        <tr>
                            <th>RFQ</th>
                            <th>Indent</th>
                            <th>Primary Item</th>
                            <th>Opening</th>
                            <th>Closing</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="rfq : ${rfqs}">
                            <td><strong th:text="${rfq.rfqNo}"></strong></td>
                            <td th:text="${rfq.indentNo}"></td>
                            <td th:text="${rfq.itemName}"></td>
                            <td th:text="${rfq.bidDate == null ? '-' : #temporals.format(rfq.bidDate,'dd MMM yyyy')}"></td>
                            <td th:text="${rfq.expiryDateOfBid == null ? '-' : #temporals.format(rfq.expiryDateOfBid,'dd MMM yyyy')}"></td>
                            <td><span class="badge rounded-pill" th:classappend="${rfq.status == 'OPEN' ? 'text-bg-success' : (rfq.status == 'CLOSED' ? 'text-bg-secondary' : (rfq.status == 'APPROVED' ? 'text-bg-success' : 'text-bg-warning'))}"
                                      th:text="${rfq.status}"></span></td>
                            <td>
                                <div class="actions d-flex flex-wrap gap-2"><a class="btn btn-light btn-sm"
                                                        th:href="@{'/admin/rfq/' + ${rfq.rfqId}}">View</a><a
                                        th:if="${rfq.status == 'DRAFT'}" class="btn btn-warning btn-sm"
                                        th:href="@{'/admin/rfq/' + ${rfq.rfqId} + '/edit'}">Edit Draft</a><a
                                        th:if="${rfq.status == 'CLOSED'}" class="btn btn-warning btn-sm"
                                        th:href="@{'/admin/rfq/' + ${rfq.rfqId} + '/extend'}">Reopen</a></div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(rfqs)}">
                            <td colspan="7" class="empty text-center text-secondary py-4">No RFQs found.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination d-flex justify-content-center mt-3" data-pagination></div>
            </div>
        </section>
    </main>
</div>
<script src="/js/table.js"></script>
</body>
</html>
