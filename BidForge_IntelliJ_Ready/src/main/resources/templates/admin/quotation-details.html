<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quotation Details | BidForge</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="bg-light"><div class="layout d-flex min-vh-100 bg-body-tertiary"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main flex-grow-1 min-vh-100"><div th:replace="~{fragments/layout :: topbar}"></div><section class="page container-fluid py-4">
<div class="d-flex justify-content-between align-items-start mb-4"><div><h1 class="h3 mb-1">Vendor Quotation Details</h1><p class="text-secondary mb-0"><span th:text="${quotation.vendor.fullName}"></span> · <span th:text="${quotation.rfq.rfqNo}"></span></p></div><a class="btn btn-outline-secondary" th:href="@{'/admin/rfq/' + ${quotation.rfq.rfqId}}">Back to RFQ</a></div>
<div class="row g-3"><div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body"><div class="small text-secondary">Bid No</div><strong th:text="${quotation.bidNo}"></strong></div></div></div><div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body"><div class="small text-secondary">Status</div><strong th:text="${quotation.status}"></strong></div></div></div><div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body"><div class="small text-secondary">Total Amount</div><strong th:text="${'₹' + quotation.quotedAmount}"></strong></div></div></div><div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body"><div class="small text-secondary">Invoice</div><strong class="text-success" th:if="${quotation.invoiceGenerated}">Generated</strong><strong class="text-secondary" th:unless="${quotation.invoiceGenerated}">-</strong></div></div></div><div class="col-md-4"><div class="card shadow-sm border-0"><div class="card-body"><div class="small text-secondary">Payment Terms</div><strong th:text="${quotation.paymentTerms == null or #strings.isEmpty(quotation.paymentTerms) ? '-' : quotation.paymentTerms}"></strong></div></div></div></div>
<div class="card shadow-sm border-0 mt-4"><div class="card-body"><h5>Per Item Pricing with GST</h5><div class="table-responsive"><table class="table table-bordered align-middle"><thead class="table-light"><tr><th>Line No</th><th>Item No</th><th>Item</th><th>Qty</th><th>Unit Price</th><th>GST %</th><th>GST Amount</th><th>Total Amount</th></tr></thead><tbody><tr th:each="item : ${quotation.items}"><td th:text="${item.rfqItem.rfqLineNo}"></td><td th:text="${item.rfqItem.itemNo}"></td><td th:text="${item.rfqItem.itemName}"></td><td th:text="${item.rfqItem.reqQty}"></td><td th:text="${'₹' + item.unitPrice}"></td><td th:text="${item.gstPercent + '%'}"></td><td th:text="${'₹' + item.gstAmount}"></td><td class="fw-bold" th:text="${'₹' + item.lineTotal}"></td></tr></tbody></table></div></div></div>
<div class="card shadow-sm border-0 mt-4"><div class="card-body"><h5>Vendor Remark</h5><p class="mb-0" th:text="${quotation.remarks == null or #strings.isEmpty(quotation.remarks) ? '-' : quotation.remarks}"></p></div></div>
</section></main></div></body></html>
