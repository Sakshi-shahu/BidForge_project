<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vendor Quotations | BidForge</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="bg-light"><div class="layout d-flex min-vh-100 bg-body-tertiary"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main flex-grow-1 min-vh-100"><div th:replace="~{fragments/layout :: topbar}"></div><section class="page container-fluid py-4">
<div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 mb-1">Vendor Quotations</h1><p class="text-secondary mb-0">Review vendor submissions, remarks and invoice status.</p></div></div>
<div class="card shadow-sm border-0"><div class="card-body">
<div class="table-toolbar d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3"><div class="search-box input-group"><span class="input-group-text">⌕</span><input data-table-search class="form-control" placeholder="Search RFQ, vendor, bid no or remarks..."></div><label class="entries-control form-label mb-0 d-flex align-items-center gap-2">Show <select data-page-size class="form-select form-select-sm"><option>10</option><option>25</option><option>50</option></select> entries</label></div>
<div class="table-responsive"><table class="table table-hover align-middle" data-table><thead class="table-light"><tr><th>RFQ No</th><th>Vendor</th><th>Bid No</th><th>Total Amount</th><th>Payment Terms</th><th>Remarks</th><th>Status</th><th>Invoice</th><th>Action</th></tr></thead><tbody>
<tr th:each="q : ${quotations}"><td th:text="${q.rfq.rfqNo}"></td><td th:text="${q.vendor.fullName}"></td><td th:text="${q.bidNo}"></td><td th:text="${'₹' + q.quotedAmount}"></td><td th:text="${q.paymentTerms == null or #strings.isEmpty(q.paymentTerms) ? '-' : q.paymentTerms}"></td><td th:text="${q.remarks == null or #strings.isEmpty(q.remarks) ? '-' : q.remarks}"></td><td><span class="badge rounded-pill" th:classappend="${q.status == 'APPROVED' ? ' text-bg-success' : (q.status == 'REJECTED' ? ' text-bg-danger' : (q.status == 'SUBMITTED' ? ' text-bg-warning' : ' text-bg-warning'))}" th:text="${q.status}"></span></td><td><span th:if="${q.invoiceGenerated}" class="badge text-bg-success">Generated</span><span th:unless="${q.invoiceGenerated}" class="text-secondary">-</span></td><td><a class="btn btn-sm btn-outline-dark" th:href="@{'/admin/quotation/' + ${q.quotationId}}">View Details</a></td></tr>
<tr th:if="${#lists.isEmpty(quotations)}"><td colspan="9" class="text-center text-secondary py-4">No vendor quotations.</td></tr></tbody></table></div><div class="pagination" data-pagination></div></div></div>
</section></main></div><script src="/js/table.js"></script></body></html>
