<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Finalized Quotations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="layout d-flex min-vh-100 bg-body-tertiary">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <main class="main flex-grow-1 min-vh-100">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <section class="page container-fluid py-4"><h1 class="page-title fw-bold mb-1">Finalized Quotations</h1>
            <div class="card shadow-sm border-0 p-4">
                <div class="table-wrap table-responsive border rounded">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Final ID</th>
                            <th>RFQ No</th>
                            <th>Indent No</th>
                            <th>Vendor</th>
                            <th>Quoted Amount</th>
                            <th>Finalized Date</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="f : ${finalized}">
                            <td th:text="${f.finalId}"></td>
                            <td th:text="${f.rfq.rfqNo}"></td>
                            <td th:text="${f.rfq.indentNo}"></td>
                            <td th:text="${f.quotation.vendor.fullName}"></td>
                            <td th:text="${f.quotation.quotedAmount}"></td>
                            <td th:text="${#temporals.format(f.finalizedDate,'dd-MM-yyyy HH:mm')}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
