<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reopen RFQ | BidForge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="layout d-flex min-vh-100 bg-body-tertiary">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <main class="main flex-grow-1 min-vh-100">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <section class="page container-fluid py-4">
            <div class="page-heading d-flex justify-content-between align-items-start gap-3 mb-4">
                <div><h1 class="page-title fw-bold mb-1">Reopen RFQ</h1></div>
            </div>
            <div th:if="${rfq.status == 'APPROVED'}" class="alert alert-danger">Approved RFQs cannot be reopened.</div>
            <div class="card shadow-sm border-0 p-4" th:if="${rfq.status != 'APPROVED'}">
                <div class="section-title fw-bold fs-5 mb-3" th:text="${rfq.rfqNo}"></div>
                <form method="post" th:action="@{'/admin/rfq/' + ${rfq.rfqId} + '/extend'}">
                    <div class="grid grid-2 row row-cols-1 row-cols-md-2 g-3">
                        <div class="field mb-3"><label class="form-label fw-semibold">New Closing Date</label><input type="date" name="newEndDate" required class="form-control">
                        </div>
                        <div class="field mb-3"><label class="form-label fw-semibold">Previous Closing Date</label><input type="text"
                                                                                      th:value="${#temporals.format(rfq.expiryDateOfBid,'dd-MM-yyyy')}"
                                                                                      readonly class="form-control"></div>
                    </div>
                    <div class="field mb-3"><label class="form-label fw-semibold">Vendors</label>
                        <div class="vendor-picker row row-cols-1 row-cols-md-2 g-3"><label class="col form-check border rounded p-3" th:each="vendor : ${vendors}"><input type="checkbox"
                                                                                               name="vendorIds"
                                                                                               th:value="${vendor.userId}"
                                                                                               th:checked="${assignedVendorIds.contains(vendor.userId)}" class="form-check-input"><span
                                th:text="${vendor.fullName}"></span></label></div>
                    </div>
                    <div class="actions d-flex flex-wrap gap-2"><a class="btn btn-light" href="/admin/rfqs">Cancel</a>
                        <button class="btn btn-success" type="submit">Reopen RFQ</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
