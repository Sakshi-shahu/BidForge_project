<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | BidForge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="layout d-flex min-vh-100 bg-body-tertiary">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <main class="main flex-grow-1 min-vh-100">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <section class="page container-fluid py-4">
            <div class="page-heading d-flex justify-content-between align-items-start gap-3 mb-4">
                <div><h1 class="page-title fw-bold mb-1">Dashboard</h1></div>
                <a class="btn btn-success" href="/admin/rfq/add">+ Create RFQ</a></div>
            <div class="grid grid-3 row row-cols-1 row-cols-md-3 g-3">
                <div class="stat card shadow-sm border-0 h-100 p-3">
                    <div class="stat-value fs-3 fw-bold" th:text="${#lists.size(rfqs)}">0</div>
                    <div class="stat-label text-secondary">RFQs</div>
                </div>
                <div class="stat card shadow-sm border-0 h-100 p-3">
                    <div class="stat-value fs-3 fw-bold" th:text="${#lists.size(finalized)}">0</div>
                    <div class="stat-label text-secondary">Approved</div>
                </div>
                <div class="stat card shadow-sm border-0 h-100 p-3">
                    <div class="stat-value fs-3 fw-bold" th:text="${openCount}">0</div>
                    <div class="stat-label text-secondary">Open</div>
                </div>
            </div>
            <div class="card shadow-sm border-0 p-4">
                <div class="section-title fw-bold fs-5 mb-3">RFQs</div>
                <div class="table-wrap table-responsive border rounded">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>RFQ</th>
                            <th>Indent</th>
                            <th>Item</th>
                            <th>Closing</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="rfq : ${rfqs}">
                            <td th:text="${rfq.rfqNo}"></td>
                            <td th:text="${rfq.indentNo}"></td>
                            <td th:text="${rfq.itemName == null ? '-' : rfq.itemName}"></td>
                            <td th:text="${rfq.expiryDateOfBid == null ? '-' : #temporals.format(rfq.expiryDateOfBid,'dd-MM-yyyy')}"></td>
                            <td><span class="badge rounded-pill" th:classappend="${rfq.status == 'OPEN' ? 'text-bg-success' : (rfq.status == 'CLOSED' ? 'text-bg-secondary' : (rfq.status == 'APPROVED' ? 'text-bg-success' : 'text-bg-warning'))}" th:text="${rfq.status}"></span></td>
                            <td><a class="btn btn-light btn-sm" th:href="@{'/admin/rfq/' + ${rfq.rfqId}}">View</a></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(rfqs)}">
                            <td colspan="6" class="empty text-center text-secondary py-4">No RFQs.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>


        </section>
    </main>
</div>
</body>
</html>
