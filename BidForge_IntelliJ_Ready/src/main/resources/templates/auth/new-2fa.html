<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BidForge | New Authenticator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-body-tertiary min-vh-100 d-flex align-items-center">
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-4 p-md-5 text-center"><span
                        class="badge text-bg-success rounded-pill px-3 py-2 mb-3">Recovery</span>
                    <h1 class="h4 fw-bold">Set up your new authenticator</h1>
                    <p class="text-secondary">Scan the QR code and enter the current 6-digit authenticator code.</p>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <div th:if="${qrDataUri}" class="border rounded-3 p-3 d-inline-block bg-light"><img
                            th:src="${qrDataUri}" class="img-fluid rounded" alt="New Google Authenticator QR Code">
                    </div>
                    <form method="post" action="/auth/verify-recovery-otp" class="mt-4">
                        <div class="mb-3 text-start"><label class="form-label fw-semibold">Authenticator
                            OTP</label><input name="otp" type="text" inputmode="numeric" maxlength="6"
                                              class="form-control form-control-lg text-center" placeholder="000000"
                                              required></div>
                        <button class="btn btn-success btn-lg w-100">Verify &amp; Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
