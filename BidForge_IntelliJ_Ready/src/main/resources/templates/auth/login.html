<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BidForge | Secure Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-body-tertiary min-vh-100 d-flex align-items-center">
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4"><span class="badge text-bg-secondary rounded-pill px-3 py-2 mb-3">JWT + 2FA</span>
                        <h1 class="h3 fw-bold mb-2">Welcome back</h1>
                        <p class="text-secondary mb-0">Sign in securely with your password and authenticator.</p></div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <form method="post" action="/auth/login">
                        <div class="mb-3"><label class="form-label fw-semibold">Email</label><input name="email" type="email" class="form-control form-control-lg" placeholder="you@example.com" required></div>
                        <div class="mb-3"><label class="form-label fw-semibold">Password</label><input name="password" type="password" class="form-control form-control-lg" placeholder="Enter your password" required></div>
                        <button class="btn btn-success btn-lg w-100" type="submit">Continue</button>
                    </form>
                    <div class="text-center mt-4"><a href="/lost-otp"
                                                     class="link-dark text-decoration-none fw-semibold">Lost
                        Authenticator OTP?</a></div>
                </div>
            </div>
            <p class="text-center text-secondary small mt-3 mb-0">Stateless JWT authentication • HttpOnly cookie • No
                server-side login session</p></div>
    </div>
</main>
</body>
</html>
