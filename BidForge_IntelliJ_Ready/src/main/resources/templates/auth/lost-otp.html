<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BidForge | Recover Authenticator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-body-tertiary min-vh-100 d-flex align-items-center">
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4"><span class="badge text-bg-warning rounded-pill px-3 py-2 mb-3">Recovery</span>
                        <h1 class="h4 fw-bold">Lost Authenticator OTP?</h1>
                        <p class="text-secondary">Verify your password and receive an OTP on your registered email.</p>
                    </div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <form method="post" action="/auth/lost-otp">
                        <div class="mb-3"><label class="form-label fw-semibold">Email</label><input name="email" type="email" class="form-control form-control-lg" required></div>
                        <div class="mb-3"><label class="form-label fw-semibold">Password</label><input name="password" type="password" class="form-control form-control-lg" required></div>
                        <button class="btn btn-success btn-lg w-100">Send Email OTP</button>
                    </form>
                    <a href="/login" class="btn btn-link w-100 mt-3">Back to login</a></div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
