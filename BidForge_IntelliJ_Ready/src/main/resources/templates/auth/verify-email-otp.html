<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BidForge | Verify Email OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-body-tertiary min-vh-100 d-flex align-items-center">
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-4 p-md-5 text-center"><span
                        class="badge text-bg-secondary rounded-pill px-3 py-2 mb-3">Email verification</span>
                    <h1 class="h4 fw-bold">Verify email OTP</h1>
                    <p class="text-secondary">Enter the 6-digit OTP sent to your registered email.</p>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <form method="post" action="/auth/verify-email-otp">
                        <div class="mb-3 text-start"><label class="form-label fw-semibold">Email OTP</label><input
                                name="otp" type="text" inputmode="numeric" maxlength="6"
                                class="form-control form-control-lg text-center" placeholder="000000" required></div>
                        <button class="btn btn-success btn-lg w-100">Verify Email OTP</button>
                    </form>
                    <a href="/login" class="btn btn-link w-100 mt-2">Cancel</a></div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
