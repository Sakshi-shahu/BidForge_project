<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error | BidForge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-shell">
    <section class="auth-panel auth-form-panel">
        <div>
            <div class="brand brand-login"><span class="brand-icon">B</span><span>BidForge</span></div>
            <h1>Something went wrong</h1>
            <div th:if="${message}" class="alert alert-danger" th:text="${message}"></div>
            <a class="btn btn-success" href="/dashboard">Back to Dashboard</a></div>
    </section>
    <section class="auth-panel auth-visual-panel">
        <div class="auth-card">
            <div class="auth-mark">B</div>
            <h2>BidForge</h2>
            <p>RFQ Management</p></div>
    </section>
</div>
</body>
</html>
