<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vendor RFQ Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="layout d-flex min-vh-100 bg-body-tertiary">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <main class="main flex-grow-1 min-vh-100">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <section class="page container-fluid py-4">
            <h1 class="page-title fw-bold mb-1">Vendor RFQ Dashboard</h1>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div class="card shadow-sm border-0 p-4"><h2>Open RFQs Assigned to You</h2>
                <div class="table-wrap table-responsive border rounded">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>RFQ No</th>
                            <th>Indent No</th>
                            <th>Buyer Name</th>
                            <th>Bid End</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="assignment : ${assignments}" th:if="${assignment.rfq.status == 'OPEN'}">
                            <td th:text="${assignment.rfq.rfqNo}"></td>
                            <td th:text="${assignment.rfq.indentNo}"></td>
                            <td th:text="${assignment.rfq.contactPerson}"></td>
                            <td th:text="${#temporals.format(assignment.rfq.expiryDateOfBid,'dd-MM-yyyy')}"></td>
                            <td><span class="badge text-bg-success">OPEN</span></td>
                            <td><a class="btn btn-light" th:href="@{'/vendor/rfq/' + ${assignment.rfq.rfqId}}">View
                                Details</a></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(assignments)}">
                            <td colspan="6">No RFQs assigned.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
