<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Submissions | BidForge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<div class="layout d-flex min-vh-100 bg-body-tertiary">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <main class="main flex-grow-1 min-vh-100">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <section class="page container-fluid py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div><h1 class="h3 mb-1">My Submissions</h1>
                    <p class="text-secondary mb-0">Your latest quotation for each RFQ.</p></div>
                <a class="btn btn-outline-dark" href="/vendor/dashboard">Open RFQs</a></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="table-toolbar d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                        <div class="search-box input-group"><span class="input-group-text">⌕</span><input
                                data-table-search class="form-control"
                                placeholder="Search RFQ, bid no, status or remarks..."></div>
                        <label class="entries-control form-label mb-0 d-flex align-items-center gap-2">Show <select
                                data-page-size class="form-select form-select-sm">
                            <option>10</option>
                            <option>25</option>
                            <option>50</option>
                        </select> entries</label></div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle" data-table>
                            <thead class="table-light">
                            <tr>
                                <th>RFQ No</th>
                                <th>Indent No</th>
                                <th>Bid No</th>
                                <th>Quoted Amount</th>
                                <th>Payment Terms</th>
                                <th>Remarks</th>
                                <th>Status</th>
                                <th>Invoice</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="q : ${quotations}">
                                <td th:text="${q.rfq.rfqNo}"></td>
                                <td th:text="${q.rfq.indentNo}"></td>
                                <td th:text="${q.bidNo}"></td>
                                <td th:text="${'₹' + q.quotedAmount}"></td>
                                <td th:text="${q.paymentTerms == null ? '-' : q.paymentTerms}"></td>
                                <td th:text="${q.remarks == null or #strings.isEmpty(q.remarks) ? '-' : q.remarks}"></td>
                                <td><span class="badge rounded-pill"
                                          th:classappend="${q.status == 'APPROVED' ? ' text-bg-success' : (q.status == 'REJECTED' ? ' text-bg-danger' : (q.status == 'SUBMITTED' ? ' text-bg-warning' : ' text-bg-warning'))}"
                                          th:text="${q.status}"></span></td>
                                <td class="text-center invoice-cell">
                                    <form th:if="${q.status == 'APPROVED' and !q.invoiceGenerated}" method="post"
                                          th:action="@{'/vendor/quotations/' + ${q.quotationId} + '/generate-invoice'}"
                                          class="m-0">
                                        <button type="submit" class="btn btn-sm btn-success">Generate</button>
                                    </form>
                                    <span th:if="${q.invoiceGenerated}" class="badge text-bg-success">Generated</span>
                                    <span th:if="${q.status != 'APPROVED' and !q.invoiceGenerated}"
                                          class="text-secondary">-</span>
                                </td>
                                <td class="text-center action-cell"><a class="btn btn-sm btn-outline-dark"
                                                                       th:href="@{'/vendor/quotations/' + ${q.quotationId}}">View
                                    Details</a></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(quotations)}">
                                <td colspan="9" class="text-center text-secondary py-4">No quotations submitted.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" data-pagination></div>
                </div>
            </div>
        </section>
    </main>
</div>
<script src="/js/table.js"></script>
</body>
</html>
