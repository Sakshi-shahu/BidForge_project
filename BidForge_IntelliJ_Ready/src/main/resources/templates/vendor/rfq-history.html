<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RFQ History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="layout d-flex min-vh-100 bg-body-tertiary">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <main class="main flex-grow-1 min-vh-100">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <section class="page container-fluid py-4">
            <div class="page-heading d-flex justify-content-between align-items-start gap-3 mb-4">
                <div><h1 class="page-title fw-bold mb-1" th:text="${rfq.rfqNo}"></h1></div>
                <a class="btn btn-light" th:href="@{'/vendor/rfq/' + ${rfq.rfqId}}">Back to RFQ</a></div>
            <div class="card shadow-sm border-0 p-4">
                <div class="timeline list-group list-group-flush">
                    <div class="timeline-row list-group-item px-0" th:each="h : ${history}">
                        <div class="timeline-dot"></div>
                        <div><strong th:text="${h.action}"></strong>
                            <p th:text="${h.remarks}"></p><small
                                    th:text="${#temporals.format(h.createdAt,'dd MMM yyyy HH:mm') + ' · closing: ' + (h.newClosingDate == null ? '-' : #temporals.format(h.newClosingDate,'dd MMM yyyy HH:mm'))}"></small>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
