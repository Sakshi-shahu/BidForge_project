<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quotation | BidForge</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="bg-light"><div class="layout d-flex min-vh-100 bg-body-tertiary"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main flex-grow-1 min-vh-100"><div th:replace="~{fragments/layout :: topbar}"></div><section class="page container-fluid py-4">
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="d-flex justify-content-between align-items-start mb-4"><div><div class="text-success small fw-bold">QUOTATION</div><h1 class="h3 mb-1" th:text="${quotation.bidNo}">Quotation</h1><div class="text-secondary" th:text="${quotation.rfq.rfqNo}"></div></div><a class="btn btn-outline-secondary" href="/vendor/quotations">Back</a></div>
<div class="row g-3"><div class="col-md-4"><div class="card shadow-sm border-0"><div class="card-body"><div class="text-secondary small">Total</div><div class="h4" th:text="${'₹' + quotation.quotedAmount}"></div></div></div></div><div class="col-md-4"><div class="card shadow-sm border-0"><div class="card-body"><div class="text-secondary small">Status</div><div class="h4" th:text="${quotation.status}"></div></div></div></div><div class="col-md-4"><div class="card shadow-sm border-0"><div class="card-body"><div class="text-secondary small">Invoice</div><div class="h4 text-success" th:if="${quotation.invoiceGenerated}">Generated</div><div th:if="${quotation.status == 'APPROVED' and !quotation.invoiceGenerated}" class="mt-2"><form method="post" th:action="@{'/vendor/quotations/' + ${quotation.quotationId} + '/generate-invoice'}"><button type="submit" class="btn btn-success btn-sm">Generate Invoice</button></form></div><div class="text-secondary" th:if="${quotation.status != 'APPROVED' and !quotation.invoiceGenerated}">Available after Admin approval</div></div></div></div></div>
<div class="card shadow-sm border-0 mt-4"><div class="card-body"><h5>Item Pricing</h5><div class="table-responsive"><table class="table table-bordered align-middle"><thead class="table-light"><tr><th>Item No</th><th>Item</th><th>Qty</th><th>Unit Price</th><th>GST %</th><th>GST Amount</th><th>Total Amount</th></tr></thead><tbody><tr th:each="item : ${quotation.items}"><td th:text="${item.rfqItem.itemNo}"></td><td th:text="${item.rfqItem.itemName}"></td><td th:text="${item.rfqItem.reqQty}"></td><td th:text="${'₹' + item.unitPrice}"></td><td th:text="${item.gstPercent + '%'}"></td><td th:text="${'₹' + item.gstAmount}"></td><td class="fw-bold" th:text="${'₹' + item.lineTotal}"></td></tr></tbody></table></div></div></div>
<div class="card shadow-sm border-0 mt-4" th:if="${quotation.remarks != null and !#strings.isEmpty(quotation.remarks)}"><div class="card-body"><h5>Remarks</h5><p class="mb-0" th:text="${quotation.remarks}"></p></div></div>
</section></main></div></body></html>
