<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside th:fragment="sidebar" class="sidebar d-flex flex-column flex-shrink-0 text-bg-dark min-vh-100">
    <a href="/dashboard" class="brand d-flex align-items-center mb-4 text-white text-decoration-none">
        <span class="fs-4 fw-bold">BidForge</span>
    </a>

    <div class="nav nav-pills flex-column gap-1" sec:authorize="hasRole('ADMIN')">
        <a class="nav-link link-light rounded text-start" href="/admin/dashboard">▦ <span>Dashboard</span></a>
        <a class="nav-link link-light rounded text-start" href="/admin/rfqs">▤ <span>RFQ List</span></a>
        <a class="nav-link link-light rounded text-start" href="/admin/rfq/add">＋ <span>Create RFQ</span></a>
        <a class="nav-link link-light rounded text-start" href="/admin/vendors">♙ <span>Vendors</span></a>
        <a class="nav-link link-light rounded text-start" href="/admin/quotations">✓ <span>Quotations</span></a>
        <a class="nav-link link-light rounded text-start" href="/admin/finalized">▣ <span>Finalized</span></a>
    </div>

    <div class="nav nav-pills flex-column gap-1" sec:authorize="hasRole('VENDOR')">
        <a class="nav-link link-light rounded text-start" href="/vendor/dashboard">▦ <span>Open RFQs</span></a>
        <a class="nav-link link-light rounded text-start" href="/vendor/quotations">⇧ <span>My Submissions</span></a>
    </div>

    <div class="mt-auto pt-4 small text-white-50">RFQ &amp; Vendor Management</div>
</aside>

<header th:fragment="topbar" class="topbar bg-white border-bottom px-4 py-3 d-flex align-items-center justify-content-between sticky-top">
    <div>
        <span class="fw-bold text-dark">BidForge</span>
    </div>
    <div class="d-flex align-items-center gap-3">
        <span class="text-secondary" sec:authentication="name">user</span>
        <span class="badge text-bg-dark rounded-pill">●</span>
        <form method="post" action="/auth/logout" class="mb-0">
            <button class="btn btn-outline-dark btn-sm" type="submit">Logout</button>
        </form>
    </div>
</header>
</body>
</html>
